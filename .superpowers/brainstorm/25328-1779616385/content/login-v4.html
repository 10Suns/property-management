<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f4f1; }
  h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .section { margin-bottom: 24px; }
  h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #333; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mockup { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; overflow: hidden; }
  .mockup-header { background: #f9f8f6; padding: 7px 12px; font-size: 10px; color: #999; border-bottom: 1px solid #e0ddd6; display: flex; gap: 5px; align-items: center; }
  .mockup-header span { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .mockup-body { height: 420px; position: relative; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
  .mockup-body::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.3); }

  .login-card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.93); border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    padding: 36px 30px; width: 280px;
  }
  .login-brand { text-align: center; margin-bottom: 26px; }
  .login-brand h1 { font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px; font-weight: 600; letter-spacing: 1.3px; color: #333; margin-bottom: 3px; }
  .login-subtitle { font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: 0.7px; }
  .field-group { margin-bottom: 12px; }
  .field-label { font-size: 10px; color: #999; margin-bottom: 2px; display: block; }
  .underline-input { width: 100%; padding: 8px 0; border: none; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #333; background: transparent; outline: none; }
  .login-btn2 { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #2c3e50; color: #fff; font-size: 12px; cursor: pointer; margin-top: 6px; font-family: inherit; }
</style>

<h2>1. 登录页 — Apple Park 背景</h2>
<p class="subtitle">苹果总部 · 明亮、现代、绿色</p>

<div class="section">
  <h3>两个 Apple Park 角度对比</h3>
  <div class="split">
    <div class="mockup">
      <div class="mockup-header"><span style="background:#ee5a5a;"></span><span style="background:#f5bd4f;"></span><span style="background:#61c454;"></span>方案 A — 远景 Apple Park</div>
      <div class="mockup-body" style="background-image:url(https://images.unsplash.com/photo-1531554694128-c4c6665f59c2?w=800&q=75);background-size:cover;background-position:center;">
        <div class="login-card">
          <div class="login-brand"><h1>物业承接查验</h1><p class="login-subtitle">Property Inspection System</p></div>
          <div class="field-group"><label class="field-label">用户名</label><input class="underline-input" placeholder="请输入用户名" /></div>
          <div class="field-group"><label class="field-label">密码</label><input class="underline-input" type="password" placeholder="请输入密码" /></div>
          <button class="login-btn2">登录</button>
        </div>
      </div>
    </div>
    <div class="mockup">
      <div class="mockup-header"><span style="background:#ee5a5a;"></span><span style="background:#f5bd4f;"></span><span style="background:#61c454;"></span>方案 B — 绿树环绕 Apple Park</div>
      <div class="mockup-body" style="background-image:url(https://images.unsplash.com/photo-1722537273909-a41f4f44ad6c?w=800&q=75);background-size:cover;background-position:center;">
        <div class="login-card">
          <div class="login-brand"><h1>物业承接查验</h1><p class="login-subtitle">Property Inspection System</p></div>
          <div class="field-group"><label class="field-label">用户名</label><input class="underline-input" placeholder="请输入用户名" /></div>
          <div class="field-group"><label class="field-label">密码</label><input class="underline-input" type="password" placeholder="请输入密码" /></div>
          <button class="login-btn2">登录</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <p style="color:#888;font-size:13px;">
    <strong>A：</strong>远景俯瞰，完整的环形建筑 + 周边环境，开阔大气<br>
    <strong>B：</strong>近距离绿树环绕，建筑细节更清晰，生机盎然
  </p>
</div>
