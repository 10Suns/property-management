<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f4f1; }
  h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .section { margin-bottom: 24px; }
  h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #333; }
  .mockup { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; overflow: hidden; }
  .mockup-header { background: #f9f8f6; padding: 7px 12px; font-size: 10px; color: #999; border-bottom: 1px solid #e0ddd6; display: flex; gap: 5px; align-items: center; }
  .mockup-header span { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Full screen background */
  .fullscreen-bg {
    height: 600px;
    background-image: url(https://images.unsplash.com/photo-1722537273909-a41f4f44ad6c?w=1400&q=80);
    background-size: cover;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .fullscreen-bg::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.35); }

  .login-card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.93); border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    padding: 44px 36px; width: 340px;
  }
  .login-brand { text-align: center; margin-bottom: 30px; }
  .login-brand h1 {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    font-size: 24px; font-weight: 600; letter-spacing: 2.5px; color: #2c3e50; margin-bottom: 6px;
  }
  .login-subtitle { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.8px; }
  .field-group { margin-bottom: 16px; }
  .field-label { font-size: 11px; color: #888; margin-bottom: 4px; display: block; }
  .underline-input { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid #ddd; font-size: 14px; color: #333; background: transparent; outline: none; transition: border-color 0.2s; }
  .underline-input:focus { border-bottom-color: #2c3e50; }
  .login-btn2 { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #2c3e50; color: #fff; font-size: 14px; cursor: pointer; margin-top: 8px; font-family: inherit; }
  .summary { background: #f9f8f6; border: 1px solid #e0ddd6; border-radius: 10px; padding: 14px 18px; }
  .summary ul { padding-left: 18px; font-size: 13px; color: #555; line-height: 1.8; }
</style>

    <div class="fullscreen-bg">

  </div>
</div>

<div class="section">
