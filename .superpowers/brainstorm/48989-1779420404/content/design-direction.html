<h2>整体设计方向 — 你喜欢哪种风格？</h2>
<p class="subtitle">以下 3 种方向决定网站的整体气质，选择一个方向后我们再细化页面布局</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简专业风</h3>
      <p>大量留白、清晰层级、灰度为主 + 单一强调色。类似 Notion / Linear 的克制设计。适合办公室桌面使用，打印友好。</p>
    </div>
  </div>
  <div class="option" data-choice="craft" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>精致卡片风</h3>
      <p>圆角卡片、柔和阴影、暖色调、微交互丰富。类似 Apple 设计风格。视觉温暖，适合需要频繁操作表单的工作场景。</p>
    </div>
  </div>
  <div class="option" data-choice="bold" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>大胆现代风</h3>
      <p>高对比度、大标题、渐变背景、玻璃效果。类似 Linear / Vercel 的设计。视觉冲击力强，现代感足。</p>
    </div>
  </div>
</div>
