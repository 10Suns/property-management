<h2>页面结构 — 导航和内容区怎么组织？</h2>
<p class="subtitle">极简风格下，两种主流布局。你的核心页面只有：模板库、我的表单、打印</p>

<div class="options">
  <div class="option" data-choice="topnav" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>顶部导航</h3>
      <p>只有一个顶部栏：Logo + 几个导航标签 + 用户名/退出。内容区占满全宽。最简洁，适合页面少、功能聚焦的场景。</p>
    </div>
  </div>
  <div class="option" data-choice="sidebar" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>侧边导航</h3>
      <p>左侧固定窄边栏放导航项，右侧主内容区。适合需要频繁切换页面的场景，空间利用率稍低但导航一目了然。</p>
    </div>
  </div>
</div>
